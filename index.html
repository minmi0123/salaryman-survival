<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#000;

/* 블록 그림 — 매 턴 뜨므로 세로를 아낀다. 짧은 화면에서는 vh 로 더 줄인다 */
.blkimg{display:block;width:100%;max-width:300px;max-height:32vh;object-fit:contain;
        aspect-ratio:4/3;margin:0 auto 10px;border:1.5px solid #000;background:#fff}

/* ── 선택지 카드 ── */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{border:1.5px solid #000;padding:10px 6px;cursor:pointer;background:#fff;text-align:center;
      font:inherit;color:inherit;font-weight:bold;font-size:14.5px;position:relative;
      min-height:62px;display:flex;flex-direction:column;
      align-items:center;justify-content:center}
.card:active{background:#ddd}
.card .t{display:block;font-weight:bold}
/* 선택지 수치·위험 배지 — 기본은 보인다(모바일 우선).
   진짜 마우스 + 넓은 화면일 때만 숨기고 hover 툴팁으로 대신한다.
   (hover:none) 한 줄에 기댔더니 스타일러스·마우스 연결·데스크톱 모드에서
   조건이 뒤집혀 수치가 통째로 사라졌다 — 2026-09-02 c951e0e 와 같은 증상이
   2026-09-11 에 재발했다. 애매한 기기에서는 '보이는 쪽' 으로 실패하게 둔다. */
.card .e{display:block;font-size:11.5px;color:#333;font-weight:normal;
         margin-top:4px;letter-spacing:-.3px}
.card .rk{display:inline;font-size:11px;font-weight:bold}
.card:disabled{opacity:.35;cursor:not-allowed}

/* 미해금 — 흐리게가 아니라 점선 + 회색. 조건 문구가 읽혀야 하므로 */
.card.lock{opacity:1;cursor:default;border-style:dashed;border-color:#999;color:#888}
.card.lock .t{font-weight:normal}
.card.lock .lk{display:block;font-size:11px;font-weight:normal;
               margin-top:5px;letter-spacing:-.3px;line-height:1.35}

/* 배경 반응은 어느 기기가 hover 를 보고하든 무해하므로 그대로 둔다 */
@media (hover:hover){ .card:not(.lock):hover{background:#f0f0f0} }

/* 데스크톱 — 진짜 마우스(pointer:fine) + 앱 폭(520px)보다 넓은 화면일 때만
   수치를 감추고 hover 툴팁으로 바꾼다. 셋을 다 만족해야 해서
   폰에서는 스타일러스·마우스가 붙어도 수치가 남는다. */
@media (hover:hover) and (pointer:fine) and (min-width:560px){
  .card .e{display:none}
  .card .rk{display:none}
  .card[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;right:0;top:100%;
    z-index:30;background:#000;color:#fff;padding:7px 9px;font-size:11.5px;line-height:1.45;
    white-space:pre-line;border:1px solid #000;text-align:left;pointer-events:none}
  /* 마지막 줄은 아래가 스크롤 영역 밖이라 잘린다 → 위로 뒤집는다 */
  .cards .card[data-tip]:nth-last-child(-n+2):hover::after{top:auto;bottom:100%}
}

.center{text-align:center}

/* ══════════════════════════════════════════════════════════════

   회차 동안 누른 선택지를 세어 판정한다. 엔딩을 볼 때 도감 칸에 박제되고,
   같은 엔딩을 다시 보면 덮어쓴다. 도감 총평은 그 기록들의 최빈값이다.
   ══════════════════════════════════════════════════════════════ */

// ① 일 처리 — 근무 시간(업무·점심·퇴근)에 고른 것만 센다.
//    저녁·주말에 노는 건 요령이 아니라 그냥 쉬는 것이다.
const 근무블록 = ['오전업무', '오후업무', '점심', '퇴근'];
const 축1 = {
  정공법: ['일하기', '야근하기', '잔업하기', '자리에서 먹고 일하기', '굶고 일하기'],
  요령:   ['일하는척하기', '대놓고 놀기', '짬때리기', '팀원에게 전화하기', '몰래 부업하기'],
};
// ② 돈벌이 — 시간대 무관
const 축2 = {
  탈출:   ['부업하기', '몰래 부업하기', '알바하기', '자기계발'],
  버티기: ['일하기', '야근하기', '잔업하기', '팀장님과 점심'],
};
// ③ 꼬리표 — 몸 관리. 기회 대비 비율로 본다
const 관리선택 = ['더자기', '한약', '잠자기', '운동하기', '기도하기'];

// 2축 조합 → 유형 이름
const 유형표 = {
  '정공법|버티기': '회사가 곧 인생',
  '정공법|탈출':   '올빼미인간',
  '요령|버티기':   '가늘고 길게',
  '요령|탈출':     '회사는 거들 뿐',
};
const 꼬리표 = { 관리: '챙길건 몸뚱아리뿐', 방치: '젊을때 고생하는거지' };
// 무너진 축 → 한 줄. 배드엔딩은 터진 축, 굿엔딩은 끝까지 지킨 축
const 무너짐 = { 멘탈: '멘탈털림', 건강: '건강털림', 업무: '업무과다', 돈: '소비과다' };
const 지킴   = { 멘탈: '멘탈이라도 챙겨야지', 건강: '건강이라도 챙겨야지',
                 업무: '일만 열심히 했다',   돈: '열심히 저축만 했다' };

/* 선택 1회를 집계에 반영한다. pick() 에서 부른다. */
function 집계(블록, 이름) {
  const t = S.tally;
  if (!t) return;
  if (근무블록.indexOf(블록) >= 0) {
    if (축1.정공법.indexOf(이름) >= 0) t.정공법++;
    if (축1.요령.indexOf(이름) >= 0)   t.요령++;
  }
  if (축2.탈출.indexOf(이름) >= 0)   t.탈출++;
  if (축2.버티기.indexOf(이름) >= 0) t.버티기++;
  t.기회++;
  if (관리선택.indexOf(이름) >= 0) t.관리++;
}

/* 이번 회차를 진단한다. 도감에 저장할 객체를 돌려준다.
   표본이 없는 축은 0.5(판정 유보)로 둔다. */
function 진단() {
  const t = S.tally || { 정공법: 0, 요령: 0, 탈출: 0, 버티기: 0, 관리: 0, 기회: 0 };
  const 비율 = (a, b) => (a + b > 0 ? a / (a + b) : 0.5);
  const a1 = 비율(t.정공법, t.요령);      // 1 에 가까울수록 정공법
  const a2 = 비율(t.탈출, t.버티기);      // 1 에 가까울수록 탈출
  const a3 = t.기회 > 0 ? t.관리 / t.기회 : 0;

  // 굿엔딩은 끝까지 가장 높게 유지된 축, 배드엔딩은 가장 많이 터진 축
  const bad = !!(S.over && S.over.kind === 'bad');
  let 축 = '멘탈';
  if (bad) {
    const c = { 멘탈: S.wm, 건강: S.wh, 업무: S.wk, 돈: S.wmoney };
    축 = Object.keys(c).reduce((x, y) => (c[y] > c[x] ? y : x), '멘탈');
  } else {
    // 네 축을 0~1 로 맞춰 같은 자로 잰다.
    // 돈 기준은 부동산가(30만). 엔딩돈(15만)으로 나누면 굿엔딩 조건이
    // 소지금 15만 이상이라 값이 항상 1 을 넘어 돈이 무조건 이긴다.
    const cap = x => Math.max(0, Math.min(1, x));
    const g = {
      멘탈: cap(S.m / 100), 건강: cap(S.h / 100),
      업무: cap(1 - S.work / Math.max(1, M.배정량())),
      돈:   cap(S.money / CFG.부동산가),
    };
    축 = Object.keys(g).reduce((x, y) => (g[y] > g[x] ? y : x), '멘탈');
  }
  return { a1: r2(a1), a2: r2(a2), a3: r2(a3), bad: bad, 축: 축, day: S.day };
}
const r2 = x => Math.round(x * 100) / 100;

/* 도감 총평 — 기록된 유형들의 최빈값.
   평균을 쓰면 도감을 모을수록 0.5 로 수렴해 "균형형" 만 나온다.
   최빈은 횟수가 같이 보여 근거가 드러나고, 다 모아도 뭉개지지 않는다. */
function 총평(dex) {
  const 표 = {}; let 기록수 = 0;
  DEX_ALL.forEach(d => {
    const v = 유형풀이(dex[d]);        // 옛 저장본의 true 는 null 이 돼 걸러진다
    if (!v) return;
    기록수++;
    표[v.이름] = (표[v.이름] || 0) + 1;
  });
  if (!기록수) return null;
  let 최다 = '', 수 = 0;
  Object.keys(표).forEach(k => { if (표[k] > 수) { 최다 = k; 수 = 표[k]; } });
  return { 이름: 최다, 수: 수, 기록수: 기록수 };
}

/* 진단 결과 → 화면에 쓸 문구들 */
function 유형풀이(d) {
  if (!d || typeof d !== 'object') return null;
  const k1 = d.a1 >= 0.5 ? '정공법' : '요령';
  const k2 = d.a2 >= 0.5 ? '탈출' : '버티기';
  const 이름 = 유형표[k1 + '|' + k2];
  // 꼬리표는 뚜렷할 때만. 애매하면 안 붙인다
  let tag = '';
  if (d.a3 >= 0.35) tag = 꼬리표.관리;
  else if (d.a3 <= 0.12) tag = 꼬리표.방치;
  return { 이름: 이름, 꼬리: tag, 끝: (d.bad ? 무너짐 : 지킴)[d.축] || '' };
}

(function initGA() {
  if (!GA_ID || isDev()) return;        // 개발자모드면 GA 스크립트 자체를 안 부름
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', GA_ID);
})();

function track(name, params) {
  try {
    const st = JSON.parse(localStorage.getItem(SKEY) || '{}');
    st[name] = (st[name] || 0) + 1;
    if (params && params.day) st.maxDay = Math.max(st.maxDay || 0, params.day);
    localStorage.setItem(SKEY, JSON.stringify(st));
  } catch (e) {}
  if (isDev()) return;                  // 내 기기 테스트는 GA 로 안 보냄
  try { if (window.gtag) window.gtag('event', name, params || {}); } catch (e) {}
}

/* ══════════════════════════════════════════════════════════════
   랜덤 이벤트 — 하루가 시작될 때 확률(CFG.이벤트확률)로 하나 뽑는다.

   원칙 둘:
   ① 경고를 직접 주지 않는다. 랜덤으로 죽으면 납득이 안 된다.
      게이지도 1 밑으로는 안 내린다(이벤트효과 참고). 경고는 플레이어가
      관리할 기회가 있었던 경로 — 게이지 0 · 월세 미납 · 발각 — 로만 나온다.
   ② 축마다 부정·긍정을 짝지어 기대값 합을 0 으로 둔다. 이벤트 때문에

const sk = id => S.skills[id] || 0;

const rank = () => {
  const d = S.day;
  if (d > CFG.승진일[3]) return 3;
  if (d > CFG.승진일[2]) return 2;

  return 0;
};
const 직급 = () => CFG.직급[rank()];

/* 감소형(1 - k×lv)은 lv 상한이 커져 음수가 되지 않도록 clamp 를 건다.
   방어형(배열)은 최고 레벨에서 100% 가 되도록 단계를 재분배한다. */
const 감쇠 = (k, lv, floor) => Math.max(floor, 1 - k * lv);

const M = {
  처리량:      () => CFG.P + sk('일잘러') * 0.75 + (sk('운동하기') + sk('기도하기')) * 0.25,

  일멘탈배율:  () => 감쇠(0.12, sk('ai사용'), 0.2),
  건강배율:    () => 감쇠(0.12, sk('짬처리'), 0.2),
  야근배율:    () => 감쇠(0.22, sk('칼퇴문화'), 0.4),

  부업수입:    () => 1 + sk('재빠른손') * 0.15 + sk('SNS개설') * 0.30,
  알바수입:    () => 1 + sk('재빠른손') * 0.15 + sk('알바n잡') * 0.22 + sk('주말 PT알바') * 0.30,
  알바건강배율:() => 감쇠(0.15, sk('알바 요령'), 0.4),
  지출배율:    () => 감쇠(0.20, sk('무소유'), 0.4),

  판매배율:    () => 1 + sk('단골 판로') * 0.25,
  발각방어:    () => [0, .4, .65, .85, 1][sk('사생활 보호 모니터')] || 0,
  지각방어:    () => [0, .3, .55, .8, 1][sk('달리기')] || 0,
  취침배율:    () => 1 + sk('규칙적인 생활') * 0.25,
  주말배율:    () => 1 + sk('주말은 쉬는 날') * 0.30 + sk('골프 접대') * 0.25,

  아침멘탈:    () => sk('기도하기') * 5 + sk('팬 응원') * 4,
  월급배율:    () => 1 + sk('사내정치') * .20 + sk('임원진급') * .40
                       + sk('팀원강화') * .12 + sk('일대신해줌') * .08,
  월세배율:    () => 감쇠(0.22, sk('무지출챌린지'), 0.4),
  카드최대:    () => sk('일대신해줌'),
  아이템효과:  () => CFG.아이템회복 * (1 + sk('약·담배 효율') * 0.25 + sk('유통 인맥') * 0.20),
  상점할인:    () => 감쇠(0.12, sk('단골'), 0.5),
  피로:        () => 1 + S.day * CFG.피로계수,
  운보정:      () => S.items.부적 > 0 ? 0.5 : 1,   // 부적: 지각·발각 확률 반감
  배정량:      () => CFG.배정[rank()] * M.배정배율() * (1 + S.day * CFG.배정증가),
};

// 해금 판정 — 계열 SP / 전체 SP / 스킬+상태
function 계열SP(name) {
  const c = TREE.find(x => x.계열 === name);
  let sum = 0;
  if (c) c.구간.forEach(g => g.nodes.forEach(n => { if (!n.end) sum += sk(n.id); }));
  return sum;
}
function 전체SP() {
  let sum = 0;
  TREE.forEach(c => c.구간.forEach(g => g.nodes.forEach(n => { if (!n.end) sum += sk(n.id); })));
  return sum;
}
/* 이 선택지를 고르면 소지금이 음수가 되나.
   표시값이 아니라 실제 지출로 본다 — 무소유(지출 -20%/lv) 가 붙으면 값이 달라진다. */
function 돈부족(c) {
  if (!S || !(c.money < 0)) return false;
  const cost = effect(c).money;
  return cost < 0 && S.money + cost < 0;
}

function gateOk(c) {
  if (c.need && sk(c.need) < 1) return false;
  // 소지금보다 비싼 선택지는 잠근다. 막지 않으면 소지금이 음수로 찍힌다.
  // 상점·부동산·경조사는 이미 같은 방식으로 막고 있어 그쪽에 맞춘 것이다.
  // 블록마다 돈이 안 드는 선택지(바로 출근하기·일하기·굶고 일하기·집가기·놀기)가
  // 하나씩 있고 그것들은 gate 도 need 도 없어서, 전부 잠겨 막히는 일은 없다.
  if (돈부족(c)) return false;
  const g = c.gate;
  if (!g) return true;
  if (g.line && 계열SP(g.line) < g.sp) return false;
  if (g.total && 전체SP() < g.total) return false;
  if (g.skill && sk(g.skill) < 1) return false;
  if (g.card && S.card < g.card) return false;
  return true;
}

const isWeekend = () => S.dow >= 6;
const blocks = () => isWeekend() ? 주말블록 : 평일블록;
const curBlock = () => blocks()[S.bi];

// 현재 블록의 그림 태그. 파일이 없으면 <img> 가 스스로 사라진다

  return f ? '<img class="blkimg" src="' + IMG.blockDir + f + '" alt="" onerror="this.remove()">' : '';
};

// 현재 블록의 선택지 목록
// 해당 블록의 전체 선택지 (미해금 포함) — 화면에 비활성으로 미리 보여주는 용도
function choicesAll() {
  const b = curBlock();
  return (b === '출근준비') ? CH.출근준비
       : (b === '오전업무' || b === '오후업무') ? CH.업무
       : (b === '점심') ? CH.점심
       : (b === '퇴근') ? CH.퇴근
       : (b === '저녁') ? CH.저녁
       : CH.주말;
}

function choices() { return choicesAll().filter(gateOk); }

// 미해금 사유를 사람이 읽는 문구로. 진행도(현재 n)를 같이 보여준다
function gateText(c) {
  const p = [];
  if (c.need) p.push('스킬 ' + c.need);
  const g = c.gate;
  if (g) {
    if (g.line) p.push(g.line.replace('관련', '') + ' SP ' + g.sp + ' (현재 ' + 계열SP(g.line) + ')');
    if (g.total) p.push('전체 SP ' + g.total + ' (현재 ' + 전체SP() + ')');
    if (g.skill) p.push('스킬 ' + g.skill);
    if (g.card) p.push('팀원 카드 ' + g.card + '개 (현재 ' + S.card + ')');
  }
  if (돈부족(c)) p.push('소지금 ' + won(-effect(c).money) + ' (현재 ' + won(S.money) + ')');
  return p.join(' · ');
}

// 선택지의 실제 효과 (표시용 + 적용용)
function effect(c) {
  const b = curBlock();
  const h = BLK[b].h;
  const three = (b === '오전업무');
  let m = c.m, hp = c.h, money = c.money || 0, work = c.work || 0;
  if (c.m3 !== undefined) { m = three ? c.m3 : c.m5; hp = three ? c.h3 : c.h5; }
  if (c.money3 !== undefined) money = three ? c.money3 : c.money5;
  if (c.workAll) work = (b === '오전업무' && S.late) ? 1 : h;
  if (c.workHalf) work = ((b === '오전업무' && S.late) ? 1 : h) / 2;

  // 배율
  if (m < 0) {
    if (c.workAll || c.k === '굶고 일하기' || c.k === '자리에서 먹고 일하기') m *= M.일멘탈배율();
    if (c.sneak || c.k === '부업하기' || c.alba) m *= M.부업멘탈배율();
    if (c.night) m *= M.야근배율();
  }
  if (hp < 0) { hp *= M.건강배율(); if (c.night) hp *= M.야근배율(); if (c.alba) hp *= M.알바건강배율(); }
  if (m > 0 && b === '저녁') m *= M.저녁배율();
  if (hp > 0 && c.k === '운동하기') hp *= M.운동배율();
  if (b.indexOf('주말') === 0) { if (m > 0) m *= M.주말배율(); if (hp > 0) hp *= M.주말배율(); }
  const fat = M.피로();
  if (m < 0) m *= fat;
  if (hp < 0) hp *= fat;
  if (money > 0) {
    if (c.sneak || c.k === '부업하기') money *= M.부업수입();
    if (c.alba) money *= M.알바수입();
  }
  if (money < 0) money *= M.지출배율();      // 무소유 — 모든 지출 감소
  // 딴짓 중 처리 (자는척 / 멀티태스킹)
  let extra = 0;
  if (c.slack && sk('자는척') > 0) extra = M.처리량() * h * Math.min(0.8, sk('자는척') * 0.15);
  if (c.sneak && sk('멀티태스킹') > 0) extra = M.처리량() * h * Math.min(0.8, sk('멀티태스킹') * 0.15);

  return { m: Math.round(m), h: Math.round(hp), money: Math.round(money),
           work: Math.round(work * M.처리량() + extra + (c.workFlat || 0)),
           card: c.card || 0, cardUse: c.cardUse || 0, q: c.q || '' };
}

function pick(c) {
  if (S.phase !== 'play') return;
  const b = curBlock();
  const e = effect(c);
  const d = [];

  if (e.work) { S.work = Math.max(-M.배정량(), S.work - e.work); d.push('업무 -' + e.work); }
  if (e.m) { S.m = Math.min(100, S.m + e.m); d.push('멘탈 ' + (e.m > 0 ? '+' : '') + e.m); }
  if (e.h) { S.h = Math.min(100, S.h + e.h); d.push('건강 ' + (e.h > 0 ? '+' : '') + e.h); }
  if (e.money) { S.money += e.money; d.push('돈 ' + (e.money > 0 ? '+' : '') + won(e.money)); }
  if (e.card) { S.card = Math.min(M.카드최대(), S.card + e.card); d.push('팀원 카드 +1'); }
  if (e.cardUse) { S.card = Math.max(0, S.card - e.cardUse); d.push('팀원 카드 -' + e.cardUse); }
  S.lastDelta = d.join(' · ');
  집계(b, c.k);
  log(BLK[b].label + ' — ' + c.k + '. ' + (d.join(' / ') || '변화 없음'));

  if (c.night) S.skipEvening = true;

  // 지각 판정
  if (c.late && Math.random() < CFG.지각확률 * (1 - M.지각방어()) * M.운보정()) {
    return openEvent({
      title: '지각', desc: '너무 개운해져버렸다!! 어떡하지?',
      opts: [
        { t: '시간멈추기 사용', need: () => S.items.시간멈추기 > 0,
          run: () => { S.items.시간멈추기--; log('시간멈추기 사용. 지각 방어.');
                       S.lastDelta = '시간멈추기 사용 · 지각 방어'; } },
        { t: '지각한다 · 경고 +1',
          run: () => { S.late = true; log('지각. 오전업무 3h → 1h.', 1); addWarn(null);
                       S.lastDelta = '지각 · 오전업무 3h → 1h · 경고 +1'; } },
      ]
    });
  }
  // 발각 판정
  if (c.caught && Math.random() < CFG.발각확률 * (1 - M.발각방어()) * M.운보정() * (c.caughtRate || 1)) {
    S.lastDelta += ' · 발각!';
    log('00씨 일 안하나! 딴짓 발각. 경고 +1.', 1);
    addWarn(null);
    if (S.phase !== 'play') { render(); save(); return; }
    return openEvent({
      title: '발각',
      desc: '"00씨 일 안하나!"' + SEP + SEP + '딴짓하다 걸렸습니다.' + SEP
          + '경고 +1  (' + S.warn + ' / ' + CFG.총경고임계 + ')',
      opts: [{ t: '...죄송합니다', run: function () {} }]
    });
  }
  afterAction();
}

// 경고 추가 — g: '멘탈'|'건강'|'업무'|'돈'|null(순손해)
//
// 모든 경고가 S.warn 한 카운터에 합산된다. 축별 카운터도 같이 돌지만
// 축이 골고루 닳으면 합계가 먼저 닿아 '짤림' 으로 끝난다.
// 2026-09-02 에 축별 분리로 바꿨다가 2026-09-09 되돌렸다 —
// 분리하면 죽는 데 너무 오래 걸려 배드엔딩으로 SP 를 쌓기 어렵고,
// 힘든 상태가 계속 이어져 재미가 떨어진다는 플레이 피드백.
function addWarn(g) {
  S.warn++;
  if (g === '멘탈') { S.wm++; S.m = 100; }
  if (g === '건강') { S.wh++; S.h = 100; }
  if (g === '업무') { S.wk++; S.work = 0; }
  if (g === '돈') { S.wmoney++; }
  const cnt = g === '멘탈' ? S.wm : g === '건강' ? S.wh : g === '업무' ? S.wk : g === '돈' ? S.wmoney : 0;
  const lim = g === '돈' ? CFG.월세임계 : CFG.게이지임계;
  if (g && cnt >= lim) {
    return badEnd({ 멘탈: '퇴사', 건강: '아사', 업무: '짤림', 돈: '백수' }[g]);
  }
  if (S.warn >= CFG.총경고임계) return badEnd('짤림');
}

// 아이템 사용 — 이벤트/상시 공용. 부작용 포함, 제조 스킬로 제거
function useItem(id) {
  if (S.items[id] <= 0) return false;
  S.items[id]--;
  const amt = Math.round(M.아이템효과());
  let msg = '';
  if (id === '약') {
    S.h = Math.min(100, S.h + amt);
    const side = sk('약 제조') > 0 ? 0 : 10;
    S.m -= side;
    msg = '약 사용 · 건강 +' + amt + (side ? ' / 멘탈 -' + side : ' (부작용 없음)');
  } else if (id === '담배') {
    S.m = Math.min(100, S.m + amt);
    const side = sk('담배 제조') > 0 ? 0 : 10;
    S.h -= side;
    msg = '담배 사용 · 멘탈 +' + amt + (side ? ' / 건강 -' + side : ' (부작용 없음)');
  } else if (id === '복권') {
    const luck = S.items.부적 > 0;          // 부적: 소액 당첨률 상향 (대박률은 그대로)
    const r = Math.random();
    const win = r < 0.03 ? 500000 : r < (luck ? 0.25 : 0.18) ? 40000 : 0;
    S.money += win;
    msg = win ? '복권 당첨! +' + won(win) : '복권 꽝.';
  } else if (id === 'AI') {
    const cut = 40;
    S.work = Math.max(-M.배정량(), S.work - cut);
    msg = 'AI 사용 · 업무 -' + cut + ' (누적 ' + Math.round(S.work) + ')';
  }
  log(msg + '.');
  S.lastDelta = msg;
  return true;
}

function checkGauges() {
  if (S.phase !== 'play') return;
  if (S.m <= 0) {
    return openEvent({
      title: '멘탈 갈림', desc: '회사생활이 너무 고통스럽다..',
      opts: [
        { t: '담배 피기', need: () => S.items.담배 > 0,
          run: () => { useItem('담배'); } },
        { t: '버틴다 · 경고 +1  「' + 경고대사.멘탈[Math.min(S.wm, 2)] + '」',
          run: () => { log('팀장님 상담. 멘탈 강제회복. 경고 +1.', 1); addWarn('멘탈'); } },
      ]
    });
  }
  if (S.h <= 0) {
    return openEvent({
      title: '건강 악화', desc: '갑자기 눈이 아프고 숨이 안쉬어진다...',
      opts: [
        { t: '약 먹기', need: () => S.items.약 > 0,
          run: () => { useItem('약'); } },
        { t: '버틴다 · 경고 +1  「' + 경고대사.건강[Math.min(S.wh, 2)] + '」',
          run: () => { log('병원 다녀옴. 건강 강제회복. 경고 +1.', 1); addWarn('건강'); } },
      ]
    });
  }
}

// 블록 진행
function afterAction() {
  checkGauges();
  if (S.phase !== 'play') return;
  advance();
}

function advance() {
  const bs = blocks();
  S.bi++;
  // 야근이면 저녁 스킵
  if (!isWeekend() && S.skipEvening && bs[S.bi] === '저녁') S.bi++;
  if (S.bi >= bs.length) return endDay();
  // 퇴근 블록 진입 시 업무 판정
  if (curBlock() === '퇴근' && S.work > 100) return workEvent();
  // 오전업무 진입 시 사무실 이벤트. 블록은 넘기지 않고 그 자리로 돌아온다
  if (curBlock() === '오전업무') {
    const e = 이벤트뽑기('am');
    if (e) return 이벤트열기(e, 블록복귀);
  }
  render();
  save();
}

function workEvent() {
  const opts = [
    { t: '야근한다 (18~23 · 저녁 소멸)',
      run: () => { pickDirect(CH.퇴근[1]); } },
  ];
  if (S.card > 0) opts.push({
    t: '팀원에게 부탁 [' + S.card + ']',
    run: () => { S.card--; S.work = Math.max(0, S.work - 60);
                 log('팀원에게 부탁. 업무 -60. 카드 -1.'); pickDirect(CH.퇴근[0]); } });
  opts.push({
    t: '그냥 집간다 · 경고 +1  「' + 경고대사.업무[Math.min(S.wk, 2)] + '」',
    run: () => { log('밤에 결국 노트북 켬. 업무 강제회복. 경고 +1.', 1);
                 addWarn('업무'); if (S.phase === 'play') pickDirect(CH.퇴근[0]); } });
  openEvent({ title: '업무 밀림', desc: '해도해도 일이 줄어들지 않는다...', opts: opts });
}

// 이벤트 안에서 퇴근 선택을 확정
function pickDirect(c) {
  const e = effect(c);
  if (e.work) S.work = Math.max(-M.배정량(), S.work - e.work);
  if (e.m) S.m = Math.min(100, S.m + e.m);
  if (e.h) S.h = Math.min(100, S.h + e.h);
  if (c.night) S.skipEvening = true;
  log(BLK['퇴근'].label + ' — ' + c.k + '.');
}

function endDay() {
  // 취침
  const rm = Math.round(CFG.취침M * M.취침배율());
  const rh = Math.round(CFG.취침H * M.취침배율());
  S.m = Math.min(100, S.m + CFG.취침M * M.취침배율());
  S.h = Math.min(100, S.h + CFG.취침H * M.취침배율());
  S.earned += CFG.SP율; S.sp += CFG.SP율;
  const sl = SLEEP[Math.floor(Math.random() * SLEEP.length)];
  log(sl + '  멘탈 +' + rm + ' / 건강 +' + rh + ' / SP +' + CFG.SP율);
  track('day_end', { day: S.day });

  if (sleepScreenOn()) {
    S.lastDelta = null;                 // 팝업이 대신 보여주므로 결과줄은 비운다
    return openEvent({
      title: '취침',
      img: IMG.sleep,
      tapAny: true,
      desc: sl + SEP + SEP
          + '멘탈 +' + rm + '   건강 +' + rh + SEP
          + 'SP +' + CFG.SP율,
      opts: [{ t: 'D' + (S.day + 1) + ' 아침으로', run: function () {} }]
    });
  }
  // 건너뛰기 상태 — 취침 정보를 결과줄에 남긴다
  S.lastDelta = sl + SEP + '멘탈 +' + rm + ' / 건강 +' + rh + ' / SP +' + CFG.SP율;
  afterSleep();
}

// 취침 이후 — 날짜 넘김 · 승진 판정 · 다음날 시작
function afterSleep() {
  const before = rank();
  S.day++; S.dow = S.dow === 7 ? 1 : S.dow + 1;
  S.bi = 0; S.late = false; S.skipEvening = false;
  if (rank() !== before) {
    log('승진. ' + 직급() + '. 배정량 증가. 월급은 그대로.', 1);
    return openEvent({
      title: '승진',
      desc: '오늘부터 ' + 직급() + '입니다.' + SEP + SEP
          + '"회사가 힘들어서 월급은 못올려줘...' + SEP + '이해해줘ㅎㅎ"' + SEP + SEP
          + '하루 업무 배정량이 늘어납니다.',
      opts: [{ t: '...네', run: function () {} }]
    });
  }
  dayStart();
}

/* ── 랜덤 이벤트 ──────────────────────────────────────
   EVENTS 테이블 위의 주석에 설계 원칙이 있다.                */

/* 하루 시작 시 추첨. 뽑혔으면 이벤트를, 아니면 null 을 준다.
   직전 2개는 후보에서 뺀다 — 같은 게 연달아 뜨면 랜덤으로 안 느껴진다. */
function 이벤트뽑기(시점) {
  if (!S || S.phase !== 'play' || S.day <= 1) return null;   // 첫날은 깨끗하게 시작한다
  if (Math.random() >= (isWeekend() ? CFG.주말이벤트확률 : CFG.이벤트확률)) return null;
  const pool = EVENTS.filter(e => e.at === 시점 && (isWeekend() ? e.e : e.w));
  if (!pool.length) return null;
  const recent = S.recentEv || [];                            // 옛 저장본에는 없다
  const cand = pool.filter(e => recent.indexOf(e.id) < 0);
  const 후보 = cand.length ? cand : pool;
  return 후보[Math.floor(Math.random() * 후보.length)];
}

/* 효과 적용. 게이지는 1 밑으로 내려가지 않는다 —
   랜덤 이벤트만으로는 죽지 않게 한다(EVENTS 주석 ①). */
function 이벤트효과(o) {
  const d = [];
  const 칸 = (nm, v) => { if (v) d.push(nm + ' ' + (v > 0 ? '+' : '') + Math.round(v)); };
  if (o.m)     { const b = S.m; S.m = Math.max(1, Math.min(100, S.m + o.m)); 칸('멘탈', S.m - b); }
  if (o.h)     { const b = S.h; S.h = Math.max(1, Math.min(100, S.h + o.h)); 칸('건강', S.h - b); }
  if (o.work)  { const b = S.work; S.work = Math.max(-M.배정량(), S.work + o.work); 칸('업무', S.work - b); }
  if (o.money) { S.money += o.money; d.push('돈 ' + (o.money > 0 ? '+' : '-') + won(Math.abs(o.money))); }
  if (o.card)  { S.card = Math.max(0, S.card + o.card); 칸('팀원 카드', o.card); }
  if (o.item)  { S.items[o.item]--; d.push(o.item + ' -1'); }
  return d;
}

/* 선택지가 무엇을 하는지 한 줄로. 팝업은 툴팁이 없어 이게 없으면
   누르기 전에 알 방법이 없다. 표기는 선택지 카드(멘+10 · 돈-3만)와 맞춘다. */
function 효과줄(o) {
  const p = [];
  if (o.m)     p.push('멘' + (o.m > 0 ? '+' : '') + o.m);
  if (o.h)     p.push('건' + (o.h > 0 ? '+' : '') + o.h);
  if (o.work)  p.push('업' + (o.work > 0 ? '+' : '') + o.work);
  if (o.money) p.push('돈' + sw(o.money));
  if (o.card)  p.push('카드' + (o.card > 0 ? '+' : '') + o.card);
  if (o.item)  p.push(o.item + '-1');
  return p.join(' ') || '변화 없음';
}

/* 팝업을 띄운다. 어느 선택지를 누르든 닫히면 넘겨받은 '다음' 으로 이어간다.
   기상은 dayBegin(그날 처리로), 오전업무는 블록복귀(그 자리에 그대로). */
function 이벤트열기(e, 다음) {
  const 고름 = o => {
    const d = 이벤트효과(o);
    S.recentEv = [e.id].concat(S.recentEv || []).slice(0, 3);   // 하루 두 번 뜰 수 있어 2 면 전날이 안 남는다
    log(e.t + ' — ' + (d.join(' / ') || '변화 없음') + '.', e.bad);
    S.lastDelta = e.t + (d.length ? SEP + d.join(' · ') : '');
  };
  // 선택지가 없는 이벤트는 확인 버튼 하나로 이벤트 자체의 효과를 받는다
  const list = e.opts || [{ t: '...그렇구나', m: e.m, h: e.h, work: e.work, money: e.money }];
  openEvent({
    title: e.t,
    evid: e.id,        // roach·sun 처럼 제목이 같은 짝이 있어 제목으로는 구분이 안 된다
    img: IMG.evDir ? IMG.evDir + e.id + '.png' : '',
    desc: e.d,
    opts: list.map(o => ({ t: o.t, sub: 효과줄(o), need: o.need, run: () => 고름(o) })),
    next: 다음,
  });
}

/* 블록 도중에 뜬 이벤트 — 블록을 넘기지 않고 그 자리로 돌아간다.
   afterAction() 을 쓰면 S.bi 가 올라가 오전업무를 통째로 건너뛴다. */
function 블록복귀() { render(); save(); }

/* 하루 시작 — 랜덤 이벤트를 먼저 굴린다. 뜨면 팝업을 닫을 때 dayBegin 으로 이어지고,
   안 뜨면 곧바로 dayBegin 이다. */
function dayStart() {
  const e = 이벤트뽑기('wake');
  if (e) return 이벤트열기(e, dayBegin);
  dayBegin();
}

function dayBegin() {
  if (S.dow === 6) return settle();   // 토요일 정산
  if (S.dow <= 5) return morning();
  render(); save();                    // 일요일
}

function morning() {
  S.m = Math.min(100, S.m + M.아침멘탈());
  const a = Math.round(M.배정량());
  S.work += a;
  log('금일 업무 배정 +' + a + '. 누적 ' + Math.round(S.work) + '.');
  S.lastDelta = (S.lastDelta ? S.lastDelta + ' · ' : '') + '업무 배정 +' + a;
  checkGauges();
  if (S.phase === 'play') { render(); save(); }
}

function settle() {
  const pay = Math.round(CFG.주급 * M.월급배율());
  S.money += pay;
  const rent = Math.round(CFG.월세 * M.월세배율() * M.지출배율());
  log('월급 입금 +' + won(pay) + '.');
  // 제조 자동생성
  const 약제 = sk('약 제조'), 담제 = sk('담배 제조'), dw = sk('다크웹 탐색');
  if (약제) { S.items.약 += 약제 + dw; log('약 제조 ' + (약제 + dw) + '개.'); }
  if (담제) { S.items.담배 += 담제; log('담배 제조 ' + 담제 + '개.'); }
  // 판매 수입
  const 단가 = 12000 * (1 + sk('거래처 확보'));
  const 판매 = sk('약 판매') + sk('담배 판매');
  const 판매액 = Math.round(단가 * 판매 * M.판매배율());
  if (판매) { S.money += 판매액; log('제품 판매 +' + won(판매액) + '.'); }
  // 팀 성과급
  const 성과급 = M.성과급();
  if (성과급) { S.money += 성과급; log('팀 성과급 +' + won(성과급) + '.'); }

  if (S.money >= rent) {
    S.money -= rent;
    log('월세 출금 -' + won(rent) + '. 잔액 ' + won(S.money) + '.');
    const lines = ['월급 ' + won(pay) + ' 입금!', ''];
    if (성과급) lines.push('팀 성과급   +' + won(성과급));
    if (판매) lines.push('제품 판매   +' + won(판매액));
    if (약제) lines.push('약 제조      ' + (약제 + dw) + '개');
    if (담제) lines.push('담배 제조    ' + 담제 + '개');
    lines.push('월세        -' + won(rent));
    lines.push('');
    lines.push('잔액        ' + won(S.money));
    openEvent({ title: '월급날', desc: lines.join(SEP),
                opts: [{ t: '확인', run: function () {} }] });
    return;
  } else {
    const opts = [];
    if (S.items.복권 > 0) opts.push({ t: '복권 긁기 [' + S.items.복권 + ']',
      run: () => {
        S.items.복권--;
        const r = Math.random();
        const win = r < 0.03 ? 500000 : r < 0.18 ? 40000 : 0;
        S.money += win;
        log('복권 결과 ' + (win ? '+' + won(win) : '꽝') + '.', !win);
        if (S.money >= rent) { S.money -= rent; log('월세 납부. 경고 없음.'); }
        else { log('월세 미납. 경고 +1.', 1); addWarn('돈'); }
      }});
    opts.push({ t: '못 낸다 · 경고 +1  「' + 경고대사.돈[Math.min(S.wmoney, 1)] + '」',
      run: () => { log('월세 미납. 경고 +1.', 1); addWarn('돈'); } });
    openEvent({ title: '월세 밀림', desc: '똑똑똑 월세내세용\n네 돈이없다구요??\n\n월세 ' + won(rent)
                                          + ' / 소지금 ' + won(S.money), opts: opts });
  }
}

/* ── 엔딩 ── */
function badEnd(name) {
  S.phase = 'ending';
  S.over = { kind: 'bad', name: name };
  S.dex[name] = 진단();            // 같은 엔딩을 다시 보면 덮어쓴다
  track('bad_ending', { name: name, day: S.day });
  log('배드엔딩 — ' + name + '.', 1);
  render(); save();
}

// 트리 완주 여부
function treeDone(treeName) {
  let ok = true;
  TREE.forEach(c => c.구간.forEach(g => {
    if (g.tree === treeName || (g.nm === '기본' && c.구간.some(x => x.tree === treeName))) {
      g.nodes.forEach(n => { if (n.end) return; if (sk(n.id) < n.max) ok = false; });
    }
  }));
  return ok;
}
// 자기관리 서브 분기점 통과 여부
function subBranch() {
  const 운동 = ['운동하기', '달리기', '헬창'].some(id => sk(id) > 0);
  const 기도 = ['기도하기', '일기쓰기', '주말 예배'].some(id => sk(id) > 0);
  const sumA = sk('운동하기') + sk('달리기') + sk('헬창');
  const sumB = sk('기도하기') + sk('일기쓰기') + sk('주말 예배');
  if (운동 && 기도) return sumA >= sumB ? '운동' : '기도';
  if (운동) return '운동';
  if (기도) return '기도';
  return null;
}

function fireEnding(node, treeName) {
  const sub = subBranch();
  let name = node.end;
  if (sub && treeName !== '운동' && treeName !== '기도') {
    const c = COMBO[treeName + '|' + sub];
    if (c) name = c;
  }
  S.phase = 'ending';
  S.over = { kind: 'good', name: name };
  S.dex[name] = 진단();
  track('good_ending', { name: name, day: S.day });
  log('엔딩 — ' + name + '.', 1);
  render(); save();
}

function buyEstate() {
  if (S.money < CFG.부동산가) return;
  S.money -= CFG.부동산가;
  S.phase = 'ending';
  S.over = { kind: 'good', name: '건물주' };
  S.dex['건물주'] = 진단();
  track('good_ending', { name: '건물주', day: S.day });
  log('부동산 구매. 건물주 엔딩.', 1);
  render(); save();
}

function restart(keepSp) {
  const dex = S.dex;
  const carry = keepSp ? Math.floor(S.bank + S.earned) : 0;
  track(keepSp ? 'rebirth' : 'restart_fresh', { sp: carry });
  S = newRun(carry, dex);
  log('입사. 기수 시작. 보유 SP ' + carry + '.');
  morning();
  TAB = 'main'; render(); save();
}

const $ = id => document.getElementById(id);

/* 화면 갱신 — innerHTML 을 통째로 갈아끼우면 스크롤이 맨 위로 튄다.
   같은 화면(탭·단계)을 다시 그리는 경우에는 위치를 지킨다. */
let LASTKEY = '';
function setScreen(html, key) {
  const el = $('screen');
  const keep = key === LASTKEY;
  const sc = keep ? (el.scrollTop || 0) : 0;
  el.innerHTML = html;
  el.scrollTop = sc;
  LASTKEY = key;
}
const esc = s => String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
const won = n => Math.round(n).toLocaleString() + '원';
/* 돈을 짧게 — 선택지 카드와 이벤트 팝업이 같은 표기를 써야 읽는 눈이 안 흔들린다 */
const sw = v => {
  const s = v > 0 ? '+' : '-', a = Math.abs(v);
  if (a >= 10000 && a % 10000 === 0) return s + (a / 10000) + '만';
  if (a >= 1000 && a % 1000 === 0) return s + (a / 1000) + '천';
  return s + a.toLocaleString();
};
const 요일 = ['', '월', '화', '수', '목', '금', '토', '일'];

function gauge(nm, v, max, danger, over) {
  const pct = Math.max(0, Math.min(100, v / max * 100));
  return '<div class="g"><span class="nm">' + nm + '</span>'
    + '<span class="track"><span class="fill' + (danger ? ' warn' : '') + '" style="width:' + pct + '%"></span></span>'
    + '<span class="val">' + Math.max(0, Math.round(v)) + ' / ' + max
    + (over ? ' <span class="over">+' + over + '</span>' : '') + '</span></div>';
}

function renderBar() {
  const over = S.work > 100 ? Math.round(S.work - 100) : 0;
  let dots = '';
  for (let i = 0; i < CFG.총경고임계; i++) dots += (i < S.warn ? '●' : '○');
  $('bar').innerHTML =
    '<div class="row1"><span>D' + S.day + ' ' + 요일[S.dow] + '요일 · ' + 직급() + '</span>'
    + '<span>' + won(S.money) + '</span></div>'
    + gauge('멘탈', S.m, 100, S.m <= 25)
    + gauge('건강', S.h, 100, S.h <= 25)
    + gauge('업무', Math.min(S.work, 100), 100, S.work > 80, over)
    + '<div id="warnrow">경고 ' + dots + '  <span style="letter-spacing:0">(' + S.warn + '/' + CFG.총경고임계
    + ')  퇴사' + S.wm + ' 아사' + S.wh + ' 백수' + S.wmoney + ' 짤림' + S.wk
    + (M.카드최대() ? '  팀원카드 ' + S.card + '/' + M.카드최대() : '') + '</span></div>';
}

function renderMain() {
  const b = curBlock();
  let h = '<div class="clock">' + BLK[b].t + '</div>'
        + '<div class="blockname">' + BLK[b].label + ' (' + BLK[b].h + '시간)'
        + (S.late && b === '오전업무' ? ' · 지각으로 1시간' : '') + '</div>'
        + '<div class="delta">' + (S.lastDelta ? esc(S.lastDelta) : '&nbsp;') + '</div>'
        + blockImgTag()
        + '<div class="cards">';
  // 터치기기용 압축 금액 표기: 3000 -> -3천 / 140000 -> -14만
  const open = choices();
  choicesAll().forEach(c => {
    // 미해금 — 비활성 카드로 해금 조건만 표시
    if (!gateOk(c)) {
      h += '<button class="card lock" disabled>'
         + '<span class="t">' + esc(c.k) + '</span>'
         + '<span class="lk">🔒 ' + esc(gateText(c)) + '</span>'
         + '</button>';
      return;
    }
    const i = open.indexOf(c);
    const e = effect(c);
    const lines = [];   // 데스크톱 툴팁용 (전체)
    const sh = [];      // 터치기기 카드용 (압축)
    if (e.work) { lines.push('업무 -' + e.work); sh.push('업-' + e.work); }
    if (e.m) { lines.push('멘탈 ' + (e.m > 0 ? '+' : '') + e.m); sh.push('멘' + (e.m > 0 ? '+' : '') + e.m); }
    if (e.h) { lines.push('건강 ' + (e.h > 0 ? '+' : '') + e.h); sh.push('건' + (e.h > 0 ? '+' : '') + e.h); }
    if (e.money) { lines.push('돈 ' + (e.money > 0 ? '+' : '') + won(e.money)); sh.push('돈' + sw(e.money)); }
    if (e.card) { lines.push('팀원 카드 +1'); sh.push('카드+1'); }
    if (e.cardUse) { lines.push('팀원 카드 -' + e.cardUse); sh.push('카드-' + e.cardUse); }
    let risk = '', badge = '';
    if (c.late) {
      const p = Math.round(CFG.지각확률 * (1 - M.지각방어()) * M.운보정() * 100);
      risk = '⚠ 지각 ' + p + '%'; badge = '⚠' + p + '%';
    }
    if (c.caught) {
      const p = Math.round(CFG.발각확률 * (1 - M.발각방어()) * M.운보정() * (c.caughtRate || 1) * 100);
      risk = '⚠ 발각 ' + p + '%'; badge = '⚠' + p + '%';
    }
    if (c.night) { risk = '저녁 블록 소멸'; sh.push('저녁소멸'); }
    if (risk) lines.push(risk);
    if (c.q) lines.push('"' + c.q + '"');
    const tip = esc(lines.join(SEP) || '변화 없음').replace(/"/g, '&quot;');
    h += '<button class="card" data-ci="' + i + '" data-tip="' + tip + '">'
       + '<span class="t">' + esc(c.k) + (badge ? ' <b class="rk">' + badge + '</b>' : '') + '</span>'
       + '<span class="e">' + (sh.length ? esc(sh.join(' ')) : '변화 없음') + '</span>'
       + '</button>';
  });
  h += '</div>';
  return h;
}

// 판매가 = 원가 x (0.5 + 판매스킬 x 0.1)
function sellPrice(id) {
  const base = SHOP.find(x => x.id === id).price;
  const lv = id === '약' ? sk('약 판매') : sk('담배 판매');
  // 구매가를 넘기면 상점 왕복만으로 무한 수익이 나므로 0.95 로 막는다
  return Math.round(base * Math.min(0.95, 0.5 + lv * 0.07));
}

    if (it.id === '부동산') return;
    const p = Math.round(it.price * M.상점할인() * M.지출배율());
    const 보유 = S.items[it.id] || 0;
    const 막힘 = S.money < p || (it.once && 보유 > 0);

       + '</div></div>';

  h += '<p style="font-size:11.5px;color:#333;margin-top:8px">'
     + 'AI 업무 -40 · 부적 지각/발각 반감 + 복권 소액당첨률↑ (비소모성, 1개만)</p>';
  h += '</div>';

     + '회사 건물을 사버리자.<div class="pr">'
     + ep.toLocaleString() + '원</div>'
     + '<button data-estate="1"' + (S.money < ep ? ' disabled' : '') + '>구입</button></div>';
  return h;
}

function renderSkill() {
  let h = '<h3>스킬 <span style="float:right;font-weight:normal">보유 SP ' + S.sp + '</span></h3>';

  TREE.forEach(c => {
    h += '<div class="tree"><div class="hd">' + c.계열 + '  <span style="font-weight:normal;font-size:12px">— ' + c.축 + '</span></div>';
    c.구간.forEach(g => {
      h += '<div style="font-size:12px;margin:6px 0 3px">' + g.nm + '</div>';
      let prevDone = true;
      g.nodes.forEach((n, idx) => {
        const lv = sk(n.id);
        const 기본완료 = c.구간[0].nodes.every(x => sk(x.id) >= x.max);
        const unlocked = (g.nm === '기본') ? prevDone : (기본완료 && prevDone);
        const 트리ok = n.end ? treeDone(g.tree) : true;
        const 돈ok  = n.end ? S.money >= CFG.엔딩돈 : true;
        const can = n.end ? (unlocked && lv < n.max && 트리ok && 돈ok)      // 엔딩은 SP 불필요
                          : (unlocked && lv < n.max && S.sp >= 1);
        h += '<div class="node' + (unlocked ? '' : ' locked') + (lv >= n.max ? ' maxed' : '')
           + (n.end ? ' endnode' : '') + '">'
           + '<div class="info"><b>' + esc(n.id) + '</b> — ' + esc(n.d)
           + (n.q ? '<div class="q">"' + esc(n.q) + '"</div>' : '')
           + (n.end ? '<div class="q">조건: 트리 완주 ' + (트리ok ? 'O' : 'X')
                      + ' · 돈 ' + won(S.money) + ' / ' + won(CFG.엔딩돈)
                      + ' ' + (돈ok ? 'O' : 'X') + '  (SP 불필요)</div>' : '')
           + '</div>'
           + '<div class="lv">' + (n.max > 1 ? lv + '/' + n.max : (lv ? '완료' : '-')) + '</div>'
           + '<button data-sk="' + esc(n.id) + '" data-tree="' + (g.tree || '') + '"'
           + (can ? '' : ' disabled') + '>' + (unlocked && n.end ? '엔딩' : '+1') + '</button></div>';
        prevDone = prevDone && lv >= n.max;
      });
    });
    h += '</div>';
  });
  return h;
}

  const v = 유형풀이(S.dex[(S.over || {}).name]);

  const 줄 = [v.꼬리, v.끝].filter(Boolean);
  return '<div class="typebox"><div class="typename">' + esc(v.이름) + '</div>'
       + (줄.length ? '<div class="typesub">' + esc(줄.join('  ·  ')) + '</div>' : '')
       + '</div>';
}

/* ══════════════════════════════════════════════════════════════
   결과 공유 카드 — canvas 로 그린다. 외부 라이브러리 없음.
   1080x1080 정사각 (카톡·인스타·X 어디서나 잘리지 않는 비율)
   ══════════════════════════════════════════════════════════════ */
const CARD = 1080;
const SHARE_URL = 'https://minmi0123.github.io/salaryman-survival/';
const 카드폰트 = w => w + ' "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';

// 긴 글을 폭에 맞춰 줄바꿈
function 줄나눔(ctx, text, maxW) {
  const out = [];
  text.split('\n').forEach(para => {
    let line = '';
    para.split('').forEach(ch => {
      if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
      else line += ch;
    });
    out.push(line);
  });
  return out;
}

/* 카드를 그려 canvas 를 콜백으로 넘긴다.
   그림은 비동기 로드라 콜백을 쓴다. 그림이 없거나 실패해도 카드는 나온다. */
function 카드그리기(mode, cb) {
  const cv = document.createElement('canvas');
  cv.width = CARD; cv.height = CARD;
  const c = cv.getContext('2d');
  const o = (mode === 'end' && S && S.over) ? S.over : {};
  const 이름 = o.name || '';
  // 도감은 시작화면(S === null)에서도 열리므로 저장본에서 직접 읽는다
  const dex = (S && S.dex) || (loadRaw() || { dex: {} }).dex || {};
  const got = DEX_ALL.filter(d => dex[d]).length;

  c.fillStyle = '#fff'; c.fillRect(0, 0, CARD, CARD);
  c.strokeStyle = '#000'; c.lineWidth = 10;
  c.strokeRect(5, 5, CARD - 10, CARD - 10);
  c.fillStyle = '#000'; c.textAlign = 'center';

  // 상단 제목
  c.font = 카드폰트('bold 40px');
  c.fillText('직장에서 살아남기', CARD / 2, 92);
  c.fillRect(CARD / 2 - 90, 112, 180, 3);

  /* 아래 y 값은 전부 고정이다. 누적해서 내리면 이름 길이에 따라
     하단 주소와 겹친다(2026-09-09 실측). 이름은 한 줄로만 쓰고 폭에 맞춰 줄인다. */
  const 마무리 = () => {
    let size = 72;
    c.font = 카드폰트('bold ' + size + 'px');
    while (c.measureText(이름).width > CARD - 140 && size > 28) {
      size -= 2; c.font = 카드폰트('bold ' + size + 'px');
    }
    c.fillText(이름, CARD / 2, 760);

    const v = 유형풀이(S.dex[이름]);
    if (v) {
      c.font = 카드폰트('bold 38px');
      c.fillText(v.이름, CARD / 2, 826);
      const 줄 = [v.꼬리, v.끝].filter(Boolean);
      if (줄.length) {
        c.fillStyle = '#555'; c.font = 카드폰트('24px');
        c.fillText(줄.join('  ·  '), CARD / 2, 862);
        c.fillStyle = '#000';
      }
    }

    c.font = 카드폰트('28px');
    const 기록 = o.kind === 'bad'
      ? 'D' + S.day + ' 생존  ·  획득 SP ' + S.earned
      : 'D' + S.day + ' 생존  ·  ' + won(S.money);
    c.fillText(기록, CARD / 2, v ? 916 : 830);

    c.font = 카드폰트('26px');
    c.fillText('엔딩 도감  ' + got + ' / ' + DEX_ALL.length, CARD / 2, v ? 956 : 872);

    c.fillStyle = '#555'; c.font = 카드폰트('26px');
    c.fillText('minmi0123.github.io/salaryman-survival', CARD / 2, CARD - 48);
    cb(cv);
  };

  // ── 도감 카드 ──
  if (mode === 'dex') {
    c.font = 카드폰트('bold 56px');
    c.fillText('엔딩 도감', CARD / 2, 190);
    c.font = 카드폰트('bold 66px');
    c.fillText(got + ' / ' + DEX_ALL.length, CARD / 2, 262);
    const t = 총평(dex);
    if (t) {
      c.font = 카드폰트('bold 40px');
      c.fillText('당신은 ' + t.이름, CARD / 2, 316);
      c.fillStyle = '#666'; c.font = 카드폰트('24px');
      c.fillText('기록된 ' + t.기록수 + '개 중 ' + t.수 + '번', CARD / 2, 348);
      c.fillStyle = '#000';
    }

    const 여백 = 70, 간격 = 10, 열 = 3;
    const 폭 = (CARD - 여백 * 2 - 간격 * (열 - 1)) / 열;
    const 높 = 74, 시작 = 총평(dex) ? 378 : 330;
    DEX_ALL.forEach((d, i) => {
      const cx = 여백 + (i % 열) * (폭 + 간격);
      const cy = 시작 + Math.floor(i / 열) * (높 + 간격);
      const 획득 = !!dex[d];
      c.strokeStyle = '#000'; c.lineWidth = 획득 ? 3 : 2;
      if (!획득) c.setLineDash([7, 6]);
      c.strokeRect(cx, cy, 폭, 높);
      c.setLineDash([]);
      c.fillStyle = 획득 ? '#000' : '#aaa';
      let 글 = 획득 ? d : '???', size = 26;
      c.font = 카드폰트('bold ' + size + 'px');
      while (c.measureText(글).width > 폭 - 16 && size > 13) {
        size -= 1; c.font = 카드폰트('bold ' + size + 'px');
      }
      c.fillText(글, cx + 폭 / 2, cy + 높 / 2 + size / 3);
    });
    c.fillStyle = '#555'; c.font = 카드폰트('26px');
    c.fillText('minmi0123.github.io/salaryman-survival', CARD / 2, CARD - 48);
    return cb(cv);
  }

  const src = endSrc(이름);
  if (!src) {
    // 그림이 없으면 자리를 비우고 이름을 위로 올린다
    c.font = 카드폰트('bold 300px');
    c.fillText('…', CARD / 2, 500);
    return 마무리();
  }
  const im = new Image();
  im.onload = () => {
    const box = 520, x = (CARD - box) / 2, y = 165;
    c.save();
    c.strokeStyle = '#000'; c.lineWidth = 4;
    c.drawImage(im, x, y, box, box);
    c.strokeRect(x, y, box, box);
    c.restore();
    마무리();
  };
  im.onerror = 마무리;
  im.src = src;
}

/* ── 공유 팝업 ──
   file:// 로 열면 canvas 가 오염돼(tainted) 이미지를 못 뽑는다.
   배포본(https)에서는 정상. 그 경우 안내 문구로 대체한다. */
let SHAREPOP = false;

function openSharePop(mode) {

  $('overlay').classList.add('on');

  카드그리기(mode, cv => {
    let url = '';
    try { url = cv.toDataURL('image/png'); } catch (e) { url = ''; }

    let h = '<h2>' + 제목 + '</h2>';

      h += '<div class="taphint">이미지를 길게 누르면 저장됩니다'
         + ' (PC 는 오른쪽 클릭)</div>';
    } else {
      h += '<div class="desc">이 카드는 배포된 주소에서만 저장됩니다.'
         + SEP + '(파일을 직접 열면 브라우저가 이미지 추출을 막습니다)</div>';
    }
    // 복사가 막힌 환경(구형·http)에서도 손으로 옮길 수 있게 주소를 보여준다
    h += '<div class="cardurl">' + SHARE_URL + '</div>';
    h += '<div class="opts">';
    // 공유를 지원하지 않으면 눌러도 아무 일이 없으므로 아예 안 그린다
    if (url && 공유가능()) h += '<button data-card="share">이미지 공유</button>';
    h += '<button data-card="link">링크 복사</button>';
    h += '<button data-card="close">닫기</button>';
    h += '</div>';
    $('pop').innerHTML = h;
    window.__card = cv;                       // 공유 버튼이 쓴다
  });
}
function closeSharePop() {
  $('overlay').classList.remove('on'); SHAREPOP = false; window.__card = null;
}

/* 이 기기에서 이미지 파일 공유가 되나.
   실제 File 을 하나 만들어 물어봐야 정확하다 — navigator.share 만 있고
   파일 공유는 안 되는 브라우저가 있다. 버튼은 될 때만 그린다. */
function 공유가능() {
  try {
    if (!navigator.share || !navigator.canShare || typeof File === 'undefined') return false;
    return navigator.canShare({ files: [new File([new Blob(['x'])], 'a.png', { type: 'image/png' })] });
  } catch (e) { return false; }
}

/* 이미지 공유 — 공유 시트를 연다. 거기서 사진 저장·카톡 전송·메시지가 다 된다.
   예전에는 공유가 안 되면 <a download> 로 내려받았는데, 같은 버튼이 기기마다
   저장이 되기도 공유가 되기도 해서 뭐가 일어날지 알 수 없었다.
   지금은 공유 하나만 한다. 내려받기는 브라우저 기본 동작(길게 누르기 ·
   오른쪽 클릭)에 맡긴다. */
function 카드공유() {
  const cv = window.__card;
  if (!cv) return;
  const 파일명 = '직장에서살아남기_'
    + (window.__cardmode === 'dex' ? '도감'
       : ((S && S.over && S.over.name) || '결과')) + '.png';
  cv.toBlob(blob => {
    if (!blob) return;
    const file = new File([blob], 파일명, { type: 'image/png' });
    if (!navigator.canShare || !navigator.canShare({ files: [file] })) return;
    navigator.share({ files: [file], title: '직장에서 살아남기' }).catch(() => {});
  }, 'image/png');
}

// 링크 복사 — clipboard API 가 막힌 환경(구형·http)에서는 textarea 로 우회
function 링크복사(btn) {
  const done = (ok) => {
    if (!btn) return;
    btn.textContent = (ok === false) ? '아래 주소를 복사하세요' : '복사됨';
    setTimeout(() => { btn.textContent = '링크 복사'; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(SHARE_URL).then(() => done(true)).catch(() => 우회복사(done));
  } else 우회복사(done);
}
function 우회복사(done) {
  let ok = false;
  try {
    const t = document.createElement('textarea');
    t.value = SHARE_URL; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    ok = document.execCommand('copy');
    t.remove();
  } catch (e) { ok = false; }
  done(ok);
}

/* ══════════════════════════════════════════════════════════════
   5. EVENTS
   ══════════════════════════════════════════════════════════════ */
/* 아무 곳이나 탭해서 닫기 — tapAny 팝업(취침)만. 첫 선택지를 실행한다 */
document.addEventListener('click', e => {
  if (e.target.closest('button')) return;              // 버튼 클릭은 아래 핸들러가 처리
  const ov = document.getElementById('overlay');
  if (!ov || !ov.classList.contains('on')) return;
  if (SHAREPOP) { closeSharePop(); return; }   // 공유 팝업도 바깥 탭으로 닫는다
  if (DEXPOP) { closeDexPop(); return; }       // 도감 팝업은 바깥 탭으로 닫는다
  const ev = S && S.ev;                        // 시작화면에서는 S 가 null 이다
  if (!ev || !ev.tapAny || !ev.opts || !ev.opts[0]) return;
  const btn = document.querySelector('#pop [data-ev="0"]');
  if (btn) btn.click();
});

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;

  if (t.dataset.title) {
    const a = t.dataset.title;
    if (a === 'dex') { SCREEN = 'titledex'; render(); return; }
    if (a === 'back') { SCREEN = 'title'; render(); return; }
    if (a === 'new') {
      if (loadRaw() && !confirm('진행 중인 기록과 엔딩 도감이 모두 사라집니다. 새로 시작할까요?')) return;
      // 저장 삭제는 인트로가 끝난 뒤에 한다 — 도중에 창을 닫아도 기록이 남는다
      if (IMG.intro && IMG.intro.length) {
        INTROAFTER = 'new'; INTRO = 0; SCREEN = 'intro'; render(); return;
      }
      startNewGame(); return;
    }
    if (a === 'continue') {
      S = load();
      if (!S) { render(); return; }
      // 유형 진단 이전에 저장된 회차에는 집계가 없다
      if (!S.tally) S.tally = { 정공법: 0, 요령: 0, 탈출: 0, 버티기: 0, 관리: 0, 기회: 0 };
      if (S.ev) { S.phase = 'play'; S.ev = null; }
      track('game_resume', { day: S.day });
      SCREEN = 'game'; TAB = 'main'; render(); return;
    }
    return;
  }
  if (t.dataset.totitle) { SCREEN = 'title'; TAB = 'main'; render(); return; }

  if (t.dataset.intro) {
    if (t.dataset.intro === 'next') { INTRO++; render(); return; }
    if (INTROAFTER === 'restart') { SCREEN = 'game'; restart(false); return; }
    startNewGame(); return;
  }
  if (t.dataset.card) {
    const a = t.dataset.card;
    if (a === 'open')  { openSharePop('end'); return; }
    if (a === 'dex')   { openSharePop('dex'); return; }
    if (a === 'share') { 카드공유(); return; }
    if (a === 'link')  { 링크복사(t); return; }
    if (a === 'close') { closeSharePop(); return; }
    return;
  }
  if (t.dataset.dexclose) { closeDexPop(); return; }
  if (t.dataset.dex) {
    const nm = t.dataset.dex;
    const st = (SCREEN === 'game' && S) ? S : (loadRaw() || { dex: {} });
    openDexPop(nm, !!(st.dex && st.dex[nm]));
    return;
  }

  if (t.dataset.tab) { TAB = t.dataset.tab; render(); return; }
  if (t.dataset.opt === 'sleep') { setSleepScreen(!sleepScreenOn()); render(); return; }
  if (t.dataset.opt === 'haptic') {
    const on = !hapticOn(); setHaptic(on);
    if (on) 진동();                       // 켤 때 한 번 울려 세기를 바로 느끼게 한다
    render(); return;
  }
  if (t.dataset.ci !== undefined) { 진동(); pick(choices()[+t.dataset.ci]); return; }

  if (t.dataset.ev !== undefined) {
    const ev = S.ev, i = +t.dataset.ev;
    if (!ev || !ev.opts || !ev.opts[i]) { closeEvent(); render(); return; }  // 중복 클릭 방어
    진동();
    closeEvent(); S.phase = 'play';
    ev.opts[i].run();
    if (S.phase === 'play') {
      // 이벤트 종류에 따라 진행.
      // next 를 들고 있으면 그걸 따른다 — 새 이벤트는 뒷일을 스스로 안다.
      // 기존 넷은 next 가 없으므로 아래 title 사슬에 그대로 걸린다.
      if (ev.next) { ev.next(); }
      else if (ev.title === '취침') { afterSleep(); }
      else if (ev.title === '승진') { dayStart(); }
      else if (ev.title === '월세 밀림' || ev.title === '월급날') { render(); save(); }
      else if (ev.title === '업무 밀림') { advance(); }
      else afterAction();
    } else { render(); save(); }
    return;
  }

  if (t.dataset.use) {
    const id = t.dataset.use;
    if (S.phase !== 'play' || id === '시간멈추기' || id === '부적') return;
    if (!useItem(id)) return;
    checkGauges();
    if (S.phase === 'play') { render(); save(); }
    return;
  }

  if (t.dataset.buy) {
    const it = SHOP.find(x => x.id === t.dataset.buy);
    const p = Math.round(it.price * M.상점할인() * M.지출배율());
    if (it.once && (S.items[it.id] || 0) > 0) return;
    if (S.money >= p) { S.money -= p; S.items[it.id]++; log(it.id + ' 구입 -' + won(p) + '.'); render(); save(); }
    return;
  }
  if (t.dataset.sell) {
    const id = t.dataset.sell;
    if ((S.items[id] || 0) <= 0) return;
    const g = sellPrice(id);
    S.items[id]--; S.money += g;
    log(id + ' 판매 +' + won(g) + '. 잔여 ' + S.items[id] + '개.');
    render(); save();
    return;
  }

  if (t.dataset.estate) { buyEstate(); return; }

  if (t.dataset.sk) {
    const id = t.dataset.sk, tree = t.dataset.tree;
    let node = null;
    TREE.forEach(c => c.구간.forEach(g => g.nodes.forEach(n => { if (n.id === id) node = n; })));
    if (!node) return;
    if (!node.end && S.sp < 1) return;
    if (node.end) { S.skills[id] = 1; fireEnding(node, tree); return; }
    S.sp -= 1; S.skills[id]++;
    track('skill_learn', { skill: id, lv: S.skills[id] });
    log('스킬 ' + id + ' Lv' + S.skills[id] + '.');
    render(); save();
    return;
  }

  if (t.dataset.re !== undefined) {
    // 환생(re=1)은 인트로를 거치지 않는다. 죽을 때마다 프롤로그를 보면 방해된다
    if (t.dataset.re === '0' && IMG.intro && IMG.intro.length) {
      INTROAFTER = 'restart'; INTRO = 0; SCREEN = 'intro'; render(); return;
    }
    restart(t.dataset.re === '1'); return;
  }
  if (t.dataset.reset) {
    if (confirm('저장 데이터를 전부 지웁니다.')) {
      저장삭제(); S = newRun(0, {}); log('입사. 기수 시작.'); morning();
      TAB = 'main'; render(); save();
    }
    return;
  }
});

/* ── 디버그 훅 (실측·자동플레이용) ── */
window.__game = {
  get state() { return S; },
  get tab() { return TAB; },
  set tab(v) { TAB = v; render(); },
  choices: () => choices(),
  effect: c => effect(c),
  get screen() { return SCREEN; },
  set screen(v) { SCREEN = v; render(); },
  reset: () => { 저장삭제(); S = newRun(0, {}); log('입사. 기수 시작.'); morning();
                 SCREEN = 'game'; TAB = 'main'; render(); save(); },
  setSkill: (id, lv) => { S.skills[id] = lv; render(); save(); },
  giveSp: n => { S.sp += n; render(); save(); },
  giveMoney: n => { S.money += n; render(); save(); },
  stats: () => { try { return JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch (e) { return {}; } },
  statsReset: () => { try { localStorage.removeItem(SKEY); } catch (e) {} return 'ok'; },
  log: () => S.log.map(l => l.t),      // 화면에서는 뺐지만 QA·디버깅용으로 유지
  dev: on => {
    try { localStorage.setItem(DEVKEY, on ? '1' : '0'); } catch (e) {}
    return '개발자모드 ' + (isDev() ? 'ON — GA 전송 안 함' : 'OFF — GA 전송함') + '. 새로고침하세요.';
  },
};

/* ── 부팅 ── */
(function boot() {
  // 시작화면부터. 게임 상태는 [새로하기] / [이어하기] 시점에 만든다
  SCREEN = 'title';
  track('title_view', { saved: loadRaw() ? 1 : 0 });
  render();
  // 첫 화면을 그린 뒤, 한가할 때 그림을 미리 받는다 (첫 로딩을 늦추지 않는다)
  // 시뮬레이터의 가짜 DOM 에는 requestIdleCallback 도 setTimeout 도 없다
  const 여유 = typeof requestIdleCallback === 'function' ? requestIdleCallback
             : typeof setTimeout === 'function' ? (f => setTimeout(f, 800))
             : (f => f());
  여유(그림미리받기);
})();
</script>
